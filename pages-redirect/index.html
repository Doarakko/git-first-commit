<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Moved</title>
    <!--
      Never served while _redirects is in effect: the /* rule matches "/" too.
      This file exists so the deployment has an asset to upload, and so a
      broken _redirects shows a working link instead of a 404. Written as a
      full document anyway, because the one time it is served is the one time
      something is already wrong.
    -->
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=https://git-first-commit.1o6.workers.dev/">
  </head>
  <body>
    <p>Moved to <a href="https://git-first-commit.1o6.workers.dev/">git-first-commit.1o6.workers.dev</a>.</p>
  </body>
</html>
